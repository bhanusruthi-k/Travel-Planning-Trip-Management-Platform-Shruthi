spring.application.name=tripnest-backend

# PostgreSQL Configuration
# Set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables in production.
# Defaults below are for local development only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tripnest}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:TripNest123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# Set JWT_SECRET as an environment variable in production.
tripnest.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
tripnest.jwt.expiration-ms=86400000

# Server Port
server.port=${PORT:8080}

# Mail Configuration (Supports Gmail, SendGrid, Mailgun, SMTP via environment variables)
# DO NOT hardcode real credentials in this file.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}

# Application Base URL for Invitation Links
app.base-url=${APP_BASE_URL:http://localhost:5173}